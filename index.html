<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة السديري</title>
<style>
:root{--bg:#f3efe8;--card:#fff;--ink:#1f1a14;--mut:#7a7164;--line:#ece5d9;--ac:#3b2f23;--gold:#b8893b;--g:#1f8a4c;--gb:#e0f3e8;--o:#c76a00;--ob:#ffedd2;--r:#c62828;--rb:#fde3e3}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);max-width:560px;margin:0 auto;padding-bottom:max(24px,env(safe-area-inset-bottom));line-height:1.5}
.hero{background:linear-gradient(160deg,#3b2f23,#5a4630);color:#fff;padding:max(22px,env(safe-area-inset-top)) 18px 70px;border-radius:0 0 28px 28px}
.hero h1{font-size:22px}.hero p{opacity:.75;font-size:12.5px;margin-top:2px}
.tot{display:flex;align-items:center;gap:16px;margin-top:16px}
.tot b{font-size:46px;line-height:1;font-variant-numeric:tabular-nums}.tot span{font-size:13px;opacity:.8;display:block}
.card{background:var(--card);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px rgba(60,40,10,.07)}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2:before{content:"";width:4px;height:16px;background:var(--gold);border-radius:2px}
.alerts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.al{border-radius:14px;padding:12px;font-size:12.5px}.al b{font-size:28px;display:block;line-height:1.1}
.al.r{background:var(--rb);color:var(--r)}.al.o{background:var(--ob);color:var(--o)}
.sz{display:flex;align-items:flex-end;gap:5px;height:150px;direction:ltr}
.sz div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.sz i{width:100%;background:linear-gradient(#b8893b,#6d4f27);border-radius:5px 5px 0 0;min-height:3px}
.sz u{text-decoration:none;font-size:10.5px;font-weight:700;margin-bottom:3px}
.sz em{font-style:normal;font-size:10px;color:var(--mut);margin-top:4px}
.sz .pk i{background:linear-gradient(#3b2f23,#1f1a14)}
.models{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{border-radius:14px;padding:10px 12px;border:1px solid var(--line);position:relative}
.m .n{font-weight:800;font-size:15px}.m .c{font-size:10.5px;color:var(--mut);min-height:15px}
.m .q{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.m .t{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:9px;display:inline-block;margin-top:2px}
.m.g .t{background:var(--gb);color:var(--g)}.m.o{background:#fffaf1}.m.o .t{background:var(--ob);color:var(--o)}.m.r{background:#fff6f6}.m.r .t{background:var(--rb);color:var(--r)}
.m:before{content:"";position:absolute;inset-block:10px;inset-inline-end:0;width:4px;border-radius:2px 0 0 2px}
.m.g:before{background:var(--g)}.m.o:before{background:var(--o)}.m.r:before{background:var(--r)}
.tw{overflow-x:auto;direction:ltr;margin:0 -6px;padding-bottom:4px}
table{border-collapse:separate;border-spacing:2px;font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--mut);padding:4px 2px;font-size:11px}
td{min-width:30px;height:30px;border-radius:7px;font-weight:700}
td.mm{position:sticky;left:0;background:#fff;text-align:left;font-weight:800;min-width:92px;z-index:1;line-height:1.2;padding-right:4px}
td.mm small{display:block;font-weight:400;color:var(--mut);font-size:10px}
td.z{background:var(--rb);color:var(--r)}td.l{background:var(--ob);color:var(--o)}td.h{background:var(--gb);color:var(--g)}td.t{background:#eee7da}
.note{font-size:11.5px;color:var(--mut);margin-top:8px}
.fab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{border-radius:14px;padding:10px 12px;font-size:12px}.f b{font-size:15px;display:block}
.f .pb{height:6px;background:rgba(0,0,0,.08);border-radius:3px;margin-top:6px;overflow:hidden}.f .pb i{display:block;height:100%;border-radius:3px}
.f.g{background:var(--gb)}.f.g i{background:var(--g)}.f.o{background:var(--ob)}.f.o i{background:var(--o)}.f.r{background:var(--rb)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.row:last-child{border:0}
.row .nm{width:48px;font-weight:800}.row .bar{flex:1;height:10px;background:#eee7da;border-radius:5px;overflow:hidden}.row .bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
.row .v{min-width:70px;text-align:left;font-weight:700}
.hid{display:none}
.home{padding:0 14px;margin-top:-50px}
.tiles{display:grid;gap:12px;margin-top:12px}
.tile{display:block;width:100%;text-align:right;border:0;border-radius:22px;padding:20px;color:#fff;font-family:inherit;box-shadow:0 6px 16px rgba(60,40,10,.18)}
.tile.df{background:linear-gradient(150deg,#b8893b,#7a5a26)}.tile.jn{background:linear-gradient(150deg,#4a3b2b,#241b12)}
.tile h3{font-size:22px}.tile .big{font-size:44px;font-weight:800;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;opacity:.85}.tile .go{float:left;font-size:30px;opacity:.7;margin-top:-6px}
.tile .chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}.tile .chips span{background:rgba(255,255,255,.2);border-radius:10px;padding:2px 10px;font-size:11.5px}
.top{display:flex;align-items:center;gap:10px;padding:max(16px,env(safe-area-inset-top)) 14px 10px}
.back{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:9px 14px;font:700 14px inherit;font-family:inherit}
.top h2{font-size:19px}
.sub{display:flex;gap:6px;padding:0 14px 10px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:4px}
.sub button{flex:1;border:0;border-radius:12px;padding:11px 4px;background:#e6dfd2;font:700 13.5px inherit;font-family:inherit;color:var(--mut)}
.sub button.on{background:var(--ac);color:#fff}
.pane{padding:0 14px}
.kp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.kp div{background:#fff;border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 2px 8px rgba(60,40,10,.07)}.kp b{font-size:22px;display:block}.kp span{font-size:11px;color:var(--mut)}
.bn{overflow:hidden;background:#f5e9d3;border-radius:18px;margin:0 0 16px;direction:ltr;position:relative}
.bn:before,.bn:after{content:"";position:absolute;top:0;bottom:0;width:36px;z-index:2;pointer-events:none}
.bn:before{left:0;background:linear-gradient(90deg,#f5e9d3,transparent)}.bn:after{right:0;background:linear-gradient(270deg,#f5e9d3,transparent)}
.bn .tr{display:flex;width:max-content;animation:mv 18s linear infinite}
.bn img{height:78px;width:auto;display:block;margin:0 22px}
@keyframes mv{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.bn .tr{animation:none}}
.tile.ex{background:linear-gradient(150deg,#2f6b57,#173a2f)}.upd{text-align:center;font-size:11.5px;color:var(--mut);margin-top:14px}
.clk{margin-top:14px;background:rgba(255,255,255,.12);border-radius:14px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;direction:rtl;font-size:12px}.clk b{font-size:20px;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-inline-start:6px;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.25}}
.clk{margin-top:14px;background:rgba(255,255,255,.12);border-radius:14px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;direction:rtl;font-size:12px}.clk b{font-size:20px;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-inline-start:6px;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.25}}
.err{background:var(--rb);color:var(--r);border-radius:14px;padding:12px;font-size:13px;margin-top:12px}
</style></head><body>
